version: '3.8'

services:
  # PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: artisan_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artisan123}
      POSTGRES_DB: ${POSTGRES_DB:-artisan_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-artisan_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Prisma Studio Web GUI Container
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artisan_prisma_studio
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-artisan123}@postgres:5432/${POSTGRES_DB:-artisan_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push && node seed.js && npx prisma studio --port 5555 --hostname 0.0.0.0"

volumes:
  postgres_data:
    driver: local
